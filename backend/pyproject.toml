[project]
name = "multi-agent-task-orchestrator-backend"
version = "0.1.0"
description = "Backend API and worker for the Multi-Agent Task Orchestrator"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.13,<2",
    "anthropic>=0.40,<1",
    "arq>=0.26,<1",
    "asyncpg>=0.30,<1",
    "docker>=7,<8",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "openai>=1.50,<3",
    "pydantic>=2.9,<3",
    "pypdf>=5,<7",
    "pydantic-settings>=2.6,<3",
    "redis>=5,<7",
    "sse-starlette>=2.1,<4",
    "sqlalchemy[asyncio]>=2.0,<3",
    "structlog>=24.4,<26",
    "tenacity>=9,<10",
    "tavily-python>=0.5,<1",
    "uvicorn[standard]>=0.32,<1",
    "python-multipart>=0.0.18,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.8,<1",
    "testcontainers[postgres,redis]>=4.9,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "."
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["arq.*", "sse_starlette.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
